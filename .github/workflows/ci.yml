name: CI

on:
  workflow_dispatch:

jobs:
  test-groq:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          response=$(curl --fail -sS https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d '{
              "model": "llama-3.3-70b-versatile",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: GROQ CONNECTION SUCCESS"
                }
              ],
              "max_tokens": 20
            }')

          echo "$response" | grep -Fq "GROQ CONNECTION SUCCESS"

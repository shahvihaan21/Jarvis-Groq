name: Jarvis AI Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-django

      - name: Run Django System Checks
        run: |
          python backend/manage.py check

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_ci_dummy_key_for_testing' }}
          SECRET_KEY: "django-insecure-ci-testing-key-for-jarvis-groq-platform"
        run: |
          python -m pytest

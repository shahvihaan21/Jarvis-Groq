name: Daily Improvement

on:
  schedule:
    # 03:30 UTC = 09:00 IST
    - cron: "30 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-improvement.yml"

permissions:
  contents: write

concurrency:
  group: daily-improvement
  cancel-in-progress: false

jobs:
  improve:
    name: Autonomous Repository Improvement
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      # ---------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # ---------------------------------------------------------------
      # Python
      # ---------------------------------------------------------------

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ---------------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ---------------------------------------------------------------
      # Git configuration
      # ---------------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "jarvis-daily-bot"
          git config user.email "actions@users.noreply.github.com"

      # ---------------------------------------------------------------
      # Verify branch
      # ---------------------------------------------------------------

      - name: Verify main branch
        run: |
          CURRENT_BRANCH="$(git branch --show-current)"

          echo "Current branch: $CURRENT_BRANCH"

          if [ "$CURRENT_BRANCH" != "main" ]; then
            echo "ERROR: Workflow is not running on main."
            exit 1
          fi

      # ---------------------------------------------------------------
      # Run autonomous engine
      # ---------------------------------------------------------------

      - name: Run daily improvement engine
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/daily_improvement.py

      # ---------------------------------------------------------------
      # Final repository state
      # ---------------------------------------------------------------

      - name: Verify repository state
        if: always()
        run: |
          echo "=========================================="
          echo "Final repository state"
          echo "=========================================="

          git branch --show-current
          git log -1 --pretty="Commit: %h %s"
          git status --short

      # ---------------------------------------------------------------
      # GitHub Actions summary
      # ---------------------------------------------------------------

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Jarvis Daily Improvement"
            echo ""
            echo "**Branch:** main"
            echo ""
            echo "**Latest commit:**"
            git log -1 --pretty="- %h %s"
            echo ""
            echo "**Repository status:**"
            echo '```'
            git status --short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

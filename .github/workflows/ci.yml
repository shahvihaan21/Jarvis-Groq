name: CI

on:
  workflow_dispatch:

jobs:
  test-groq:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -uo pipefail

          response=$(curl -sS -X POST -w '\n%{http_code}' https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d '{
              "model": "openai/gpt-oss-20b",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: GROQ CONNECTION SUCCESS"
                }
              ],
              "max_tokens": 20
            }')
          curl_status=$?
          http_status="${response##*$'\n'}"
          response_body="${response%$'\n'*}"

          echo "Groq HTTP status: $http_status"
          echo "Groq response body:"
          printf '%s\n' "$response_body"

          if [ "$curl_status" -ne 0 ]; then
            exit "$curl_status"
          fi
          if [ "$http_status" -ge 400 ]; then
            exit 1
          fi
          printf '%s' "$response_body" | grep -Fq "GROQ CONNECTION SUCCESS"

  analyze-repository:
    runs-on: ubuntu-latest
    needs: test-groq

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run read-only improvement agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/daily_agent.py

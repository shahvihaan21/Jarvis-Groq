name: Daily Improvement

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-improvement
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Configure git
        run: |
          git config user.name "jarvis-daily-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run daily improvement engine
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python scripts/daily_improvement.py

      - name: Summary
        if: always()
        run: |
            echo "### Daily Improvement run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest commit: $(git log -1 --pretty='%h %s')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sync state: $(git status -sb | head -1)" >> "$GITHUB_STEP_SUMMARY"

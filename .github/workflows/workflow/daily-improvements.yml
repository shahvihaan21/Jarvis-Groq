name: Daily Jarvis-Groq Improvement

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Confirm repository
        run: |
          echo "Repository checked out successfully."
          echo "Current branch:"
          git branch --show-current

name: CI

on:
  workflow_dispatch:

jobs:
  test-groq:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          curl -v -X POST \
            "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            --data-raw '{
              "model": "openai/gpt-oss-20b",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: GROQ CONNECTION SUCCESS"
                }
              ],
              "max_completion_tokens": 20
            }'

  analyze-repository:
    runs-on: ubuntu-latest
    needs: test-groq

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run read-only improvement agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/daily_agent.py

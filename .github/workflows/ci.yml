name: CI

on:
  workflow_dispatch:

env:
  OPENROUTER_MODEL: openrouter/pareto-code

jobs:
  test-openrouter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Test OpenRouter API
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w '\n%{http_code}' \
            -X POST \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-raw '{
              "model": "'"${OPENROUTER_MODEL}"'",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: OPENROUTER CONNECTION SUCCESS"
                }
              ],
              "max_tokens": 20
            }')

          http_status="${response##*$'\n'}"
          response_body="${response%$'\n'*}"

          echo "OpenRouter HTTP status: $http_status"
          echo "OpenRouter response:"
          printf '%s\n' "$response_body"

          if [ "$http_status" -ge 400 ]; then
            exit 1
          fi

  analyze-repository:
    runs-on: ubuntu-latest
    needs: test-openrouter

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run read-only improvement agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/daily_agent.py
